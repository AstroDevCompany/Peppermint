- name: zen.adblock.enabled
  value: true

- name: zen.adblock.level
  value: medium

# Heavy level only: look up the real host behind third-party names, so ads
# served through a CNAME alias are still caught.
- name: zen.adblock.cname-uncloak
  value: true

- name: zen.adblock.customRules
  value: ""

# Hosts whose scriptlets are handed to every content process ahead of time, so
# they run before the page's own scripts. Needed where a site's anti-adblock
# code runs in its first inline scripts (YouTube).
- name: zen.adblock.early-script-hosts
  value: "www.youtube.com,m.youtube.com,music.youtube.com,tv.youtube.com,youtube.com,www.youtube-nocookie.com,youtube-nocookie.com,www.youtubekids.com,youtubekids.com"

# Requests blocked so far, over all pages. Kept on this device only.
- name: zen.adblock.stats.blocked-total
  value: 0

# When YouTube refuses to play while ads are blocked and the retries do not
# clear it, pause blocking on YouTube in that tab until it is closed.
- name: zen.adblock.youtube-wall-fallback
  value: true

# Leave YouTube pages alone: YouTube refuses to play while it detects an ad
# blocker, and what gets past that changes often.
- name: zen.adblock.youtube.pause
  value: false

# The id of an ad blocker extension to turn on while a YouTube tab is open
# (only with the pause above), or empty for none.
- name: zen.adblock.youtube.extension
  value: ""

# The extension Peppermint turned on for YouTube, so that it is turned off
# again afterwards. Not a setting.
- name: zen.adblock.youtube.extension-started
  value: ""
