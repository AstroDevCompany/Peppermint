<html:template id="template-paneZenAdblock">

<hbox id="zenAdblockCategory"
      class="subcategory"
      hidden="true"
      data-category="paneZenAdblock">
<html:h1 data-l10n-id="zen-adblock-section-title"/>
</hbox>

<groupbox id="zenAdblockGroup" data-category="paneZenAdblock" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-adblock-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-adblock-description" />

      <hbox align="center">
            <label data-l10n-id="zen-adblock-choice-label"/>
            <menulist id="zenAdblocker">
                  <menupopup/>
            </menulist>
      </hbox>

      <hbox align="center">
            <description id="zenAdblockStatus" class="description-deemphasized" flex="1"/>
            <button id="zenAdblockInstall" data-l10n-id="zen-adblock-install" hidden="true"/>
      </hbox>
</groupbox>

<groupbox id="zenCookieConsentGroup" data-category="paneZenAdblock" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-cookie-consent-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-cookie-consent-description" />
      <checkbox id="zenCookieConsentEnabled"
                data-l10n-id="zen-cookie-consent-enabled"
                preference="zen.cookie-consent.enabled"/>
      <description id="zenCookieConsentStatus" class="description-deemphasized"/>
</groupbox>

<groupbox id="zenSiteExceptionsGroup" data-category="paneZenAdblock" hidden="true" class="highlighting-group">
      <label><html:h2 data-l10n-id="zen-site-exceptions-header"/></label>
      <description class="description-deemphasized" data-l10n-id="zen-site-exceptions-description" />
      <vbox id="zenSiteExceptionsList" role="list"/>
      <description id="zenSiteExceptionsEmpty"
                   class="description-deemphasized"
                   data-l10n-id="zen-site-exceptions-empty" />
      <hbox>
            <button id="zenSiteExceptionsClear" data-l10n-id="zen-site-exceptions-clear"/>
      </hbox>
</groupbox>

</html:template>
